  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

</head>
<body>
  <div id="__bundler_placeholder">Loading HMS Simplified – klikkbar HMS-prototype...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

kground:var(--disabled);cursor:not-allowed}\n.btns:disabled{opacity:.6;cursor:default}\n.btns{min-height:44px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0 14px}\n.sec{display:flex;flex-direction:column;gap:10px}\n.screen{display:flex;flex-direction:column;gap:18px}\n.tile{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:116px;cursor:pointer;color:var(--text)}\n.ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--on-accent-soft);display:flex;align-items:center;justify-content:center;flex:none}\nbutton:focus-visible,.row:focus-visible,.tile:focus-visible{outline:2px solid var(--text);outline-offset:2px}\n.theme-light{color-scheme:light;--bg:#F5F4EF;--surface:#FFFFFF;--surface-2:#FBFAF6;--text:#1C1C1C;--text-2:#3A3832;--muted:#5E5B53;--border:#E2E0D8;--border-strong:#CFCCC2;--track:#E9E7DF;--divider:#ECEAE3;--hover:#F0EFE8;--primary:#1C1C1C;--on-primary:#FFFFFF;--accent-soft:#E9DCF2;--on-accent-soft:#1C1C1C;--accent-tint:#F6F0FA;--accent:#7A3E96;--disabled:#B9B6AC;--warn-bg:#FFF1C9;--warn-fg:#5C4300;--alert-bg:#FBEAE2;--alert-fg:#8F3610;--alert-text:#B5461A;--info-bg:#E6E9F5;--info-fg:#2F3A6B}\n.theme-dark{color-scheme:dark;--bg:#121014;--surface:#1D1A21;--surface-2:#24202A;--text:#F2EFF5;--text-2:#D5CFDC;--muted:#ABA3B5;--border:#322D39;--border-strong:#4A4353;--track:#2C2733;--divider:#2A2630;--hover:#2A2630;--primary:#C08AD8;--on-primary:#121014;--accent-soft:#4A2E5C;--on-accent-soft:#F2EFF5;--accent-tint:#271E2E;--accent:#C08AD8;--disabled:#4A4353;--warn-bg:#3D3210;--warn-fg:#F3D27A;--alert-bg:#3E2116;--alert-fg:#F2A383;--alert-text:#F08A5D;--info-bg:#1F2540;--info-fg:#B7C2F0}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"{{themeClass}}\" style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column\">\n\n<!-- ============ INNLOGGING ============ -->\n<sc-if value=\"{{scr.login}}\" hint-placeholder-val=\"{{true}}\">\n  <div style=\"flex: 1; overflow-y: auto; padding: 48px 20px 24px; display: flex; flex-direction: column; gap: 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n      <div style=\"display: flex; justify-content: flex-end; width: 100%\"><button type=\"button\" sc-camel-on-click=\"{{toggleTheme}}\" aria-label=\"{{themeLabel}}\" title=\"{{themeLabel}}\" style=\"all: unset; width: 44px; height: 44px; flex: none; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); box-sizing: border-box\">\n      <svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{themeIcon}}\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <\u002Fdiv>\n      <img src=\"37e85ebf-d670-4791-8562-68d0535e7a11\" alt=\"HMS Simplified\" style=\"width: 100%; max-width: 270px; height: auto; display: block; margin-bottom: 0\">\n      <h1 style=\"margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1\">En enklere tilgang til HMS<\u002Fh1>\n      <p style=\"margin: 0; font-size: 15px; color: var(--muted); line-height: 1.5\">HMS-appen for City Frisør Rosenlund. Velg hvem du vil logge inn som for å se appen fra ulike roller.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card list\" style=\"display: flex; flex-direction: column; overflow: hidden\">\n      <sc-for list=\"{{employees}}\" as=\"e\" hint-placeholder-count=\"5\">\n        <button type=\"button\" class=\"row\" sc-ca ue}}\">\n      <img src=\"b21bbedd-d795-4b47-8651-dda00cbd3235\" alt=\"HMS Simplified\" style=\"width: 40px; height: 40px; border-radius: 11px; display: block; margin-left: 4px\">\n    <\u002Fsc-if>\n    <div style=\"flex: 1; display: flex; flex-direction: column; padding-left: 8px; min-width: 0\">\n      <span style=\"font-size: 12px; color: var(--muted); font-weight: 600\">{{subtitle}}<\u002Fspan>\n      <h1 style=\"margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{title}}<\u002Fh1>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{toggleTheme}}\" aria-label=\"{{themeLabel}}\" title=\"{{themeLabel}}\" style=\"all: unset; width: 44px; height: 44px; flex: none; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); box-sizing: border-box\">\n      <svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{themeIcon}}\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{logout}}\" aria-label=\"Bytt bruker\" style=\"all: unset; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 6px 4px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); min-height: 44px; box-sizing: border-box\">\n      <span class=\"av\" style=\"background: {{me.color}}\">{{me.initials}}<\u002Fspan>\n      <span style=\"font-size: 12px; font-weight: 700; color: var(--text-2); padding-right: 4px\">Bytt<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <main style=\"flex: 1; overflow-y: auto; padding: 18px 20px 28px; box-sizing: border-box\">\n\n    <!-- ============ HJEM ============ -->\n    <sc-if value=\"{{scr.home}}\" h  14px; color: var(--text-2); line-height: 1.45\">{{l.text}}<\u002Fspan>\n                  <sc-if value=\"{{l.hasGoal}}\" hint-placeholder-val=\"{{false}}\">\n                    <span style=\"align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border)\">{{l.goalLabel}}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{l.hasFeedback}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"background: var(--accent-tint); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45\"><strong>{{l.feedbackBy}}:<\u002Fstrong> {{l.feedback}}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{l.canApprove}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                      <label style=\"flex: 1 1 200px\"><span style=\"position: absolute; left: -9999px\">Tilbakemelding<\u002Fspan><input class=\"inp\" type=\"text\" placeholder=\"Tilbakemelding (valgfritt)\" value=\"{{l.draft}}\" sc-camel-on-change=\"{{l.onDraft}}\"><\u002Flabel>\n                      <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{l.approve}}\">Godkjenn<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Læreplan -->\n        <sc-if value=\"{{lp.showPlan}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"screen\">\n            <p style=\"margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5\">Kompetansemålene i Læreplan i Vg3 frisørfaget (FRI03-02). Et mål blir påbegynt når det er koblet til en loggføring eller oppgave. Veileder markerer når lærlingen mestrer målet.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: r c-camel-on-click=\"{{lp.addTask}}\" disabled=\"{{lp.taskInvalid}}\" style=\"min-height: 48px\">Gi oppgaven<\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fsc-if>\n            <div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n              <section class=\"sec\">\n                <h2 class=\"h2\">Åpne oppgaver ({{lp.openCount}})<\u002Fh2>\n                <sc-if value=\"{{lp.noOpen}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-size: 14px; color: var(--muted)\">Ingen åpne oppgaver.<\u002Fp><\u002Fsc-if>\n                <div class=\"card list\" style=\"overflow: hidden\">\n                  <sc-for list=\"{{lp.openTasks}}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <label style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; cursor: pointer\">\n                      <input type=\"checkbox\" checked=\"{{t.done}}\" sc-camel-on-change=\"{{t.toggle}}\" style=\"width: 22px; height: 22px; accent-color: var(--primary); margin: 2px 0 0; flex: none\">\n                      <span style=\"display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0\">\n                        <span style=\"font-size: 14px; font-weight: 700\">{{t.title}}<\u002Fspan>\n                        <span style=\"font-size: 12px; color: var(--muted)\">{{t.meta}}<\u002Fspan>\n                        <sc-if value=\"{{t.hasGoal}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size: 12px; color: var(--text-2)\">{{t.goalLabel}}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fspan>\n                      <sc-if value=\"{{t.soon}}\" hint-placeholder-val=\"{{false}}\"><span class=\"chip\" style=\"background: var(--warn-bg); color: var(--warn-fg)\">Snart frist<\u002Fspan><\u002Fsc-if>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsection>\n              <section class=\"sec\">\n                <h2 class=\"h2\">Fullført ({{lp.doneCount}})<\u002Fh2>\n                <div class=\"card list\" style=\"overflow: hidden\">\n                  <sc-for list=\"{{lp.doneTasks}}\" as=\"t\" hint-placeholder-count=\"1\">\n                    <label style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; cursor: pointer\">\n                      <input type=\"checkbox\" checked=\"{{t.done}}\" sc-camel-on-change=\"{{t.toggle}}\" style=\"width: 22px; height: 22px; accent-color: var(--primary); margin: 2px 0 0; flex: none\">\n                      <span style=\"display: flex; flex-direction: column; gap: 3px\"><span style=\"font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: line-through\">{{t.title}}<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">{{t.meta}}<\u002Fspan><\u002Fspan>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ PERSONALHÅNDBOK ============ -->\n    <sc-if value=\"{{scr.handbok}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"screen\">\n        <p style=\"margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5\">Håndboken utfyller arbeidsavtalen og HMS-rutinene. Sist oppdatert [dato] av Hanne Hårfagre.<\u002Fp>\n        <label style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span class=\"lbl\">Søk i håndboken<\u002Fspan>\n          <input class=\"inp\" type=\"search\" placeholder=\"F.eks. ferie, lønn, sykmelding\" value=\"{{hbQuery}}\" sc-camel-on-change=\"{{onHbQuery}}\">\n        <\u002Flabel>\n\n        <div class=\"card\" style=\"padding: 14px 16px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px\">\n            <span style=\"font-size: 14px; font-weight: 700\">{{hbProgressTitle}}<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; color: var(--text-2)\">{{hbProgressText}}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"height: 6px; border-radius: 999px; background: var(--track); overflow: hidden\"><span style=\"display: block; height: 6px; background: var(--text); width: {{hbPct}}\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n\n        <section class=\"sec\">\n          <h2 class=\"h2\">Kapitler<\u002Fh2>\n          <sc-if value=\"{{hbEmpty}}\" hint-placeholder-val=\"{{false}}\">\n            <p style=\"margin: 0; font-size: 14px; color: var(--muted); text-align: center; padding: 16px 0\">Ingen treff på «{{hbQuery}}».<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{chapters}}\" as=\"ch\" hint-placeholder-count=\"6\">\n            <div class=\"card\" style=\"overflow: hidden\">\n              <button type=\"button\" class=\"row\" sc-camel-on-click=\"{{ch.toggle}}\" aria-expanded=\"{{ch.open}}\" style=\"min-height: 56px\">\n                <span style=\"display: flex; flex-direction: column; flex: 1; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700\">{{ch.title}}<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">{{ch.sub}}<\u002Fspan><\u002Fspan>\n                <span class=\"chip\" style=\"background: {{ch.chipBg}}; color: var(--text); border: {{ch.chipBorder}}\">{{ch.chip}}<\u002Fspan>\n                <span style=\"font-size: 20px; line-height: 1; color: var(--muted); width: 18px; text-align: center\">{{ch.sign}}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ch.open}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px\">\n                  <sc-for list=\"{{ch.paras}}\" as=\"pa\" hint-placeholder-count=\"2\">\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: var(--text)\">{{pa.t}}<\u002Fp>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ch.hasItems}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 12px; padding: 12px 14px\">\n                      <div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: baseline\"><span class=\"lbl\">Din gjennomgang<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: var(--text-2)\">{{ch.itemsProgress}}<\u002Fspan><\u002Fdiv>\n                      <sc-for list=\"{{ch.items}}\" as=\"it\" hint-placeholder-count=\"8\">\n                        <label style=\"display: flex; gap: 12px; align-items: center; min-height: 40px; cursor: pointer\">\n                          <input type=\"checkbox\" checked=\"{{it.done}}\" sc-camel-on-change=\"{{it.toggle}}\" style=\"width: 22px; height: 22px; accent-color: var(--primary); margin: 0; flex: none\">\n                          <span style=\"font-size: 14px; line-height: 1.4\">{{it.t}}<\u002Fspan>\n                        <\u002Flabel>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ch.hasLinks}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                      <span class=\"lbl\">Les mer<\u002Fspan>\n                      <sc-for list=\"{{ch.links}}\" as=\"ln\" hint-placeholder-count=\"1\">\n                        <a href=\"{{ln.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--bg); text-decoration: none; color: var(--text); font-size: 14px; font-weight: 700\">\n                          <span style=\"flex: 1\">{{ln.title}}<\u002Fspan>\n                          <svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fa>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ch.hasAction}}\" hint-placeholder-val=\"{{false}}\">\n                    <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{ch.action}}\">{{ch.actionLabel}}<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ch.canConfirm}}\" hint-placeholder-val=\"{{false}}\">\n                    <button type=\"button\" class=\"btnp\" sc-camel-on-click=\"{{ch.confirm}}\" style=\"min-height: 48px\">Jeg har lest og forstått dette<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ch.confirmed}}\" hint-placeholder-val=\"{{false}}\">\n                    <span style=\"font-size: 13px; font-weight: 700; color: var(--text-2); display: flex; align-items: center; gap: 6px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>Du har bekreftet at du har lest dette<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ch.showReaders}}\" hint-placeholder-val=\"{{false}}\">\n                    <span style=\"font-size: 12px; color: var(--muted); line-height: 1.45\">Ikke lest ennå: {{ch.missing}}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section class=\"sec\">\n          <h2 class=\"h2\">Nyttige lenker<\u002Fh2>\n          <div class=\"card list\" style=\"overflow: hidden\">\n            <sc-for list=\"{{hbLinks}}\" as=\"ln\" hint-placeholder-count=\"6\">\n              <a href=\"{{ln.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; box-sizing: border-box; text-decoration: none; color: var(--text)\">\n                <span style=\"display: flex; flex-direction: column; flex: 1\"><span style=\"font-size: 14px; font-weight: 700\">{{ln.title}}<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">{{ln.sub}}<\u002Fspan><\u002Fspan>\n                <svg style=\"color: var(--muted)\" aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 12px; color: var(--muted)\">Lenkene åpnes i en ny fane.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ ANSATTE OG ROLLER ============ -->\n    <sc-if value=\"{{scr.folk}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"screen\">\n        <sc-for list=\"{{infoGroups}}\" as=\"g\" hint-placeholder-count=\"4\">\n          <section class=\"sec\">\n            <h2 class=\"h2\">{{g.label}}<\u002Fh2>\n            <p style=\"margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45\">{{g.desc}}<\u002Fp>\n            <div class=\"card list\" style=\"overflow: hidden\">\n              <sc-for list=\"{{g.people}}\" as=\"e\" hint-placeholder-count=\"1\">\n                <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; box-sizing: border-box\">\n                  <span class=\"av\" style=\"background: {{e.color}}\">{{e.initials}}<\u002Fspan>\n                  <span style=\"display: flex; flex-direction: column; flex: 1\"><span style=\"font-size: 14px; font-weight: 700\">{{e.name}}<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">{{e.role}} · [tlf.nr.]<\u002Fspan><\u002Fspan>\n                  <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{e.message}}\" style=\"min-height: 40px; font-size: 13px\">Chat<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ RAPPORTER OG LÆRING (LEDER) ============ -->\n    <sc-if value=\"{{scr.rapport}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"screen\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between\">\n          <div role=\"tablist\" aria-label=\"Periode\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--track); padding: 4px; border-radius: 12px; flex: 1 1 280px; max-width: 480px\">\n            <sc-for list=\"{{rap.periods}}\" as=\"p\" hint-placeholder-count=\"3\">\n              <button type=\"button\" role=\"tab\" aria-selected=\"{{p.on}}\" sc-camel-on-click=\"{{p.pick}}\" style=\"all: unset; text-align: center; min-height: 40px; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{p.bg}}; color: var(--text)\">{{p.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{rap.copy}}\">{{rap.copyLabel}}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px\">\n          <sc-for list=\"{{rap.kpis}}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div class=\"card\" style=\"padding: 12px 14px; display: flex; flex-direction: column; gap: 2px\">\n              <span style=\"font-size: 26px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums\">{{k.value}}<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; color: var(--text-2)\">{{k.label}}<\u002Fspan>\n              <span style=\"font-size: 11px; color: var(--muted)\">{{k.sub}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <section class=\"sec\">\n          <h2 class=\"h2\">Hva lærer vi av avvikene?<\u002Fh2>\n          <p style=\"margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 760px\">{{rap.method}}<\u002Fp>\n          <sc-if value=\"{{rap.noInsights}}\" hint-placeholder-val=\"{{false}}\">\n            <p style=\"margin: 0; font-size: 14px; color: var(--muted)\">Ingen mønstre funnet i perioden.<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start\">\n            <sc-for list=\"{{rap.insights}}\" as=\"i\" hint-placeholder-count=\"4\">\n              <article class=\"card\" style=\"padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid {{i.stripe}}\">\n                <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n                  <span class=\"chip\" style=\"background: {{i.chipBg}}; color: {{i.chipFg}}\">{{i.kind}}<\u002Fspan>\n                  <span style=\"font-size: 12px; color: var(--muted); font-weight: 600\">{{i.evidence}}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 15px; font-weight: 800; line-height: 1.35\">{{i.title}}<\u002Fspan>\n                <span style=\"font-size: 14px; color: var(--text-2); line-height: 1.45\">{{i.text}}<\u002Fspan>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                  <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{i.save}}\" disabled=\"{{i.saved}}\" style=\"min-height: 38px; font-size: 13px; padding: 0 12px\">{{i.saveLabel}}<\u002Fbutton>\n                  <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{i.share}}\" disabled=\"{{i.shared}}\" style=\"min-height: 38px; font-size: 13px; padding: 0 12px\">{{i.shareLabel}}<\u002Fbutton>\n                  <sc-if value=\"{{i.hasGo}}\" hint-placeholder-val=\"{{false}}\">\n                    <button type=\"button\" class=\"btns\" sc-camel-on-click=\"{{i.go}}\" style=\"min-height: 38px; font-size: 13px; padding: 0 12px\">{{i.goLabel}}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start\">\n          <section class=\"sec\" style=\"flex: 1 1 300px; min-width: 0\">\n            <h2 class=\"h2\">Avvik etter kategori<\u002Fh2>\n            <div class=\"card\" style=\"padding: 14px 16px; display: flex; flex-direction: column; gap: 12px\">\n              <sc-for list=\"{{rap.byCat}}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                  <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700\"><span>{{b.label}}<\u002Fspan><span style=\"font-variant-numeric: tabular-nums\">{{b.n}}<\u002Fspan><\u002Fdiv>\n                  <span style=\"height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; display: flex\"><span style=\"display: block; height: 8px; background: var(--text); width: {{b.pct}}\"><\u002Fspan><\u002Fspan>\n                  <span style=\"font-size: 11px; color: var(--muted)\">{{b.ids}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"sec\" style=\"flex: 1 1 300px; min-width: 0\">\n            <h2 class=\"h2\">Avvik etter type<\u002Fh2>\n            <div class=\"card\" style=\"padding: 14px 16px; display: flex; flex-direction: column; gap: 12px\">\n              <sc-for list=\"{{rap.byType}}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                  <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700\"><span>{{b.label}}<\u002Fspan><span style=\"font-variant-numeric: tabular-nums\">{{b.n}}<\u002Fspan><\u002Fdiv>\n                  <span style=\"height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; display: flex\"><span style=\"display: block; height: 8px; background: var(--accent); width: {{b.pct}}\"><\u002Fspan><\u002Fspan>\n                  <span style=\"font-size: 11px; color: var(--muted)\">{{b.ids}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <section class=\"sec\">\n          <h2 class=\"h2\">Erfaringsbank ({{rap.bankCount}})<\u002Fh2>\n          <p style=\"margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5\">Lærdom fra ferdigstilte avvik og læringspunkter lagret av leder. Brukes i rapporten og på personalmøter.<\u002Fp>\n          <div class=\"card\" style=\"padding: 12px; display: flex; gap: 8px; flex-wrap: wrap\">\n            <label style=\"flex: 1 1 240px\"><span style=\"position: absolute; left: -9999px\">Nytt læringspunkt<\u002Fspan><input class=\"inp\" type=\"text\" placeholder=\"Skriv et nytt læringspunkt\" value=\"{{rap.draft}}\" sc-camel-on-change=\"{{rap.onDraft}}\"><\u002Flabel>\n            <button type=\"button\" class=\"btnp\" sc-camel-on-click=\"{{rap.addLearning}}\" disabled=\"{{rap.draftEmpty}}\" style=\"width: auto; min-height: 44px; padding: 0 18px; font-size: 14px\">Lagre<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"card list\" style=\"overflow: hidden\">\n            <sc-for list=\"{{rap.bank}}\" as=\"l\" hint-placeholder-count=\"2\">\n              <div style=\"padding: 12px 16px; display: flex; flex-direction: column; gap: 4px\">\n                <span style=\"font-size: 14px; line-height: 1.45\">{{l.text}}<\u002Fspan>\n                <span style=\"font-size: 12px; color: var(--muted)\">{{l.meta}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ RUTINER ============ -->\n    <sc-if value=\"{{scr.rutiner}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"screen\">\n        <button type=\"button\" sc-camel-on-click=\"{{goIK}}\" style=\"all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; background: var(--primary); color: var(--on-primary); padding: 16px; border-radius: 16px; cursor: pointer\">\n          <span style=\"width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center\">\n            <svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M3 9h18M3 15h18M9 3v18M15 3v18\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"display: flex; flex-direction: column; flex: 1\"><span style=\"font-size: 16px; font-weight: 800\">Internkontroll<\u002Fspan><span style=\"font-size: 13px; opacity: 0.9\">Risikoanalyse og sjekklister · {{checkSummary}}<\u002Fspan><\u002Fspan>\n          <svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\
